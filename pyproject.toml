[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TreeTime"
version = "2026.1"
authors = [
  { name="Jacob Kanev", email="jkanev@zoho.com" },
]
description = "TreeTime is a to-do list manager, test report tool, project manager, family ancestry editor, mind-mapping tool, etc. Using TreeTime you can categorise and organise any data in tree structures. You can define several trees, each with a different structure, on the same data. You can use functions (sums, ratios and means) recursively up the branches of a tree."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyQt6",
    "netifaces",
    "requests",
    "werkzeug",
]

[project.urls]
"Homepage" = "https://tree-time.info"

[project.scripts]
treetime = "treetime.__main__:main"

[tool.setuptools]
packages = ["treetime"]

[tool.setuptools.package-data]
treetime = ["themes/*.svg"]
